services:
  chat:
    build: .
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - chat-data:/data
    environment:
      PORT: "3000"
      DATA_DIR: /data
      CORS_ORIGIN: https://chat.jdump.com
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 3s
      retries: 5

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    network_mode: host
    volumes:
      - /etc/cloudflared:/etc/cloudflared:ro
      - /home/jeshua/.cloudflared:/home/jeshua/.cloudflared:ro
    command: tunnel --config /etc/cloudflared/chat-api.yml run bcd37932-d11f-44d5-a9a6-1557a9961943

volumes:
  chat-data:
