services:
  chat:
    build: .
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - chat-data:/data
    environment:
      PORT: "3000"
      DATA_DIR: /data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 3s
      retries: 5
volumes:
  chat-data:
