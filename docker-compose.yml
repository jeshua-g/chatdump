services:
  chat:
    build: .
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - chat-data:/data
    environment:
      PORT: "3000"
      DATA_DIR: /data
      CORS_ORIGIN: ${CORS_ORIGIN:-https://chat.jdump.com}
      GUEST_LIMIT: ${GUEST_LIMIT:-50}
      GUEST_WINDOW_MIN: ${GUEST_WINDOW_MIN:-30}
      GUEST_COOLDOWN_SEC: ${GUEST_COOLDOWN_SEC:-2}
      GUEST_TTL_HOURS: ${GUEST_TTL_HOURS:-24}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 3s
      retries: 5

volumes:
  chat-data:
