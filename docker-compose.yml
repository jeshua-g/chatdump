services:
  chat:
    build: .
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - chat-data:/data
    environment:
      PORT: "3000"
      DATA_DIR: /data
      CORS_ORIGIN: https://chat.jdump.com
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 3s
      retries: 5

    cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    network_mode: host
    volumes:
      - /etc/cloudflared/chat-api.yml:/etc/cloudflared/chat-api.yml:ro
      - /etc/cloudflared/chat-api-credentials.json:/etc/cloudflared/chat-api-credentials.json:ro
    command: tunnel --config /etc/cloudflared/chat-api.yml run

volumes:
  chat-data:
